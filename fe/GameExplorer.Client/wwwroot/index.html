<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Game Explorer</title>
	<base href="/" />
	<link rel="preload" id="webassembly" />
	<script>
		// Gira prima di Blazor: decide subito il colore dello sfondo (regole html[data-theme] in app.css),
		// così durante il caricamento non c'è un lampo bianco. Tema salvato, altrimenti quello del sistema.
		(function () {
			var saved = null;
			try { saved = localStorage.getItem('theme'); } catch (e) { }
			var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
			document.documentElement.dataset.theme = dark ? 'dark' : 'light';
		})();
	</script>
	<link rel="stylesheet" href="css/app.css" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link href="GameExplorer.Client.styles.css" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
	<link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
	<script type="importmap"></script>
</head>

<body>
	<div id="app">
		<svg class="loading-progress">
			<circle r="40%" cx="50%" cy="50%" />
			<circle r="40%" cx="50%" cy="50%" />
		</svg>
		<div class="loading-progress-text"></div>
	</div>

	<div id="blazor-error-ui">
	   Si è verificato un errore imprevisto.
		<a href="." class="reload">Ricarica</a>
		<span class="dismiss" aria-label="Chiudi">🗙</span>
	</div>
		<script src="js/carousel.js"></script>
		<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
		<script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
