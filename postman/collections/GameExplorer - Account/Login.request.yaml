$kind: http-request
url: "http://localhost:5290/api/account/login?useCookies=true"
method: POST
queryParams:
  useCookies: "true"
body:
  type: json
  content: ' { "email": "{{email}}", "password": "{{vault:password}}" }'
scripts:
  - type: afterResponse
    code: pm.test("200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
