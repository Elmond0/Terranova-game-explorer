# Database checks (owner: Elmond0): a broken setup fails on the PR, not on a teammate's PC after the merge.
name: database

on:
  pull_request:
    # Only these paths, so frontend PRs do not wait for it. This file is listed too: a change here gets tested.
    paths:
      - "compose.yaml"
      - "Makefile"
      - ".env.example"
      - ".gitattributes"
      - "db/**"
      - "be/GameExplorer.Api/Data/**"
      - ".github/workflows/database.yml"
  push:
    # Again on main: two PRs green on their own can break once merged together.
    branches: [main]
    paths:
      - "compose.yaml"
      - "Makefile"
      - ".env.example"
      - ".gitattributes"
      - "db/**"
      - "be/GameExplorer.Api/Data/**"
      - ".github/workflows/database.yml"
  # Manual run from the Actions tab, without pushing a commit
  workflow_dispatch:

# Read-only token: the jobs only read, so a compromised action cannot push
permissions:
  contents: read

# Only the last push of a PR matters: older runs are cancelled to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Five small jobs instead of one: they run in parallel and a red one says which part is broken
jobs:
  # A typo in compose.yaml fails here in seconds, before the slow smoke job
  config:
    name: compose config
    runs-on: ubuntu-24.04          # pinned: ubuntu-latest changes over time
    timeout-minutes: 5             # a stuck job stops now, not after the default 6 hours
    steps:
      # Pinned by commit SHA (a tag can be moved); Dependabot keeps it up to date
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no git token left on disk
      - name: Validate compose.yaml
        # No secrets/ in CI: compose only warns about the missing files
        run: docker compose config --quiet

  # Quoting and syntax bugs found without running anything
  lint:
    name: lint scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (db scripts)
        run: shellcheck db/init/*.sh
      - name: actionlint (workflow files)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # A change in Data/ without its migration works locally but breaks the database of everyone else
  migrations:
    name: migrations up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # dotnet ef runs Program.cs, which stops without these; fake values, nothing connects to them
    env:
      ConnectionStrings__Default: "Host=localhost;Database=ci;Username=ci;Password=ci"
      Cors__FrontendOrigin: http://localhost:5100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore dotnet-ef (dotnet-tools.json)
        run: dotnet tool restore
      # dotnet ef needs obj/project.assets.json, and it does not restore by itself
      - name: Restore NuGet packages
        run: dotnet restore be/GameExplorer.Api
      - name: No model change without a migration
        run: dotnet ef migrations has-pending-model-changes --project be/GameExplorer.Api

  # The README on a clean clone, automated: if this passes, a new teammate can start too
  smoke:
    name: start, migrate, backup, restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No dotnet restore and no fake variables here: db.cs must manage on a clean clone, like a new teammate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # secrets/ is git-ignored, so a fresh VM has none: create them like a new teammate
      - name: Create secrets (random passwords) and .env
        run: |
          mkdir -p secrets
          for f in postgres_password app_db_password api_db_password; do
            pw="$(openssl rand -hex 24)"
            # Hide the passwords in the (public) logs
            echo "::add-mask::$pw"
            printf %s "$pw" > "secrets/$f.txt"
          done
          # Not used by the database job, but the Makefile and compose expect the files
          printf %s ci > secrets/twitch_id.txt
          printf %s ci > secrets/twitch_key.txt
          cp .env.example .env

      # Fresh VM = empty volume, so the db/init scripts run
      - name: First start on an empty volume
        run: docker compose up -d --wait

      # -T: CI has no terminal. -tA: only the bare value, so test can compare it
      - name: Migrations user is not a superuser and owns the database
        run: |
          result="$(docker compose exec -T db psql -U terranova -d terranova -tAc \
            "select r.rolsuper::text || ' ' || pg_get_userbyid(d.datdba)
             from pg_roles r, pg_database d
             where r.rolname = 'terranova_app' and d.datname = 'terranova'")"
          echo "$result"
          test "$result" = "false terranova_app"

      - name: Runtime user cannot create tables
        run: |
          if out="$(docker compose exec -T db psql -U terranova_api -d terranova -c 'create table x(i int)' 2>&1)"; then
            echo "::error::terranova_api can create tables"
            exit 1
          fi
          echo "$out"
          grep -q "permission denied for schema public" <<< "$out"

      # --idempotent in db.cs: the second run must skip what is already applied
      - name: Migrations apply twice
        run: |
          dotnet db/scripts/db.cs migrate
          dotnet db/scripts/db.cs migrate

      - name: Runtime user reads favorites and wishlist but cannot truncate or drop them
        run: |
          for table in favorites wishlist; do
            test "$(docker compose exec -T db psql -U terranova_api -d terranova -tAc "select count(*) from $table")" = "0"

            if out="$(docker compose exec -T db psql -U terranova_api -d terranova -c "truncate $table" 2>&1)"; then
              echo "::error::terranova_api can truncate $table"
              exit 1
            fi
            echo "$out"
            grep -q "permission denied for table $table" <<< "$out"

            if out="$(docker compose exec -T db psql -U terranova_api -d terranova -c "drop table $table" 2>&1)"; then
              echo "::error::terranova_api can drop $table"
              exit 1
            fi
            echo "$out"
            grep -q "must be owner of table $table" <<< "$out"
          done

      # ci_check is a marker: if it is back after drop + restore, the backup really holds the data
      - name: Backup, then restore as the migrations user
        run: |
          docker compose exec -T db psql -U terranova_app -d terranova \
            -c 'create table ci_check(x int); insert into ci_check values (42)'
          dotnet db/scripts/db.cs backup
          docker compose exec -T db psql -U terranova_app -d terranova -c 'drop table ci_check'
          # Only one backup exists here
          backups=(db/backups/*.sql)
          dotnet db/scripts/db.cs restore "${backups[0]}"
          test "$(docker compose exec -T db psql -U terranova -d terranova -tAc 'select x from ci_check')" = "42"
          # Tables created by terranova_app are readable by terranova_api (ALTER DEFAULT PRIVILEGES)
          test "$(docker compose exec -T db psql -U terranova_api -d terranova -tAc 'select x from ci_check')" = "42"

      # down without -v keeps the volume
      - name: Data survives down + up
        run: |
          docker compose down
          docker compose up -d --wait
          test "$(docker compose exec -T db psql -U terranova -d terranova -tAc 'select x from ci_check')" = "42"

      - name: Database logs (only if something failed)
        if: failure()
        run: docker compose logs db

      - name: Clean up
        if: always()
        run: docker compose down -v

  # A teammate on Windows must not get CRLF scripts (they would break the container)
  windows:
    name: Windows checkout (line endings)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      # Same setting as a teammate on Windows with Git defaults
      - name: Enable core.autocrlf
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts keep LF line endings (.gitattributes)
        shell: bash
        run: |
          if grep -rlI $'\r' --include='*.sh' db/; then
            echo "::error::CRLF line endings in the files above: check .gitattributes"
            exit 1
          fi
          echo "All .sh files use LF"
      # Only config: Windows runners cannot start Linux containers
      - name: Validate compose.yaml on Windows
        shell: bash
        run: docker compose config --quiet
