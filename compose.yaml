name: terranova

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_password
      - app_db_password
      - api_db_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terranova}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-terranova}
      APP_DB_USER: ${APP_DB_USER:-terranova_app}
      API_DB_USER: ${API_DB_USER:-terranova_api}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  adminer:
    image: adminer:6.2.0
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
  api_db_password:
    file: ./secrets/api_db_password.txt
