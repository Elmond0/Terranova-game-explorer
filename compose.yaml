# Local development environment (not production).
# Start: docker compose up -d --wait  ·  Adminer: docker compose --profile tools up -d
name: terranova
services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    # Log queries slower than 200 ms: to check the SQL generated by EF Core
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    security_opt:
      - no-new-privileges:true
    environment:
      # Admin (superuser): maintenance and backups, NOT the backend
      POSTGRES_USER: ${POSTGRES_USER:-terranova}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      POSTGRES_DB: ${POSTGRES_DB:-terranova}
      # Migrations and restore user (owner), created by db/init/01-app-user.sh on first start
      APP_DB_USER: ${APP_DB_USER:-terranova_app}
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (see .env.example)}"
      # Runtime user of the backend (rows only), created by db/init/02-api-user.sh
      API_DB_USER: ${API_DB_USER:-terranova_api}
      API_DB_PASSWORD: "${API_DB_PASSWORD:?set API_DB_PASSWORD in .env (see .env.example)}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Since PostgreSQL 18 the volume goes on /var/lib/postgresql (no longer .../data)
      - pgdata:/var/lib/postgresql
      # Run only on an empty volume (first start)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      # "$$" becomes "$": the variable is read by the container, not by compose.
      # -h 127.0.0.1: the temporary init server listens only on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  adminer:
    image: adminer:6.1.2
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks:
      - backend
    # Hardening: runs as non-root "adminer"; nothing writable except /tmp (PHP sessions)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
networks:
  backend:
