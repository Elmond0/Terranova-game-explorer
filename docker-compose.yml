name: terranova
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terranova}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      POSTGRES_DB: ${POSTGRES_DB:-terranova}
      APP_DB_USER: ${APP_DB_USER:-terranova_app}
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (see .env.example)}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:
networks:
  backend:
