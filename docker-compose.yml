name: terranova
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terranova}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set it in .env (see .env.example)}"
      POSTGRES_DB: ${POSTGRES_DB:-terranova}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
volumes:
  pgdata:
